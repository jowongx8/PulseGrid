name: pulsegrid-production

services:
  backend:
    image: ${PULSEGRID_BACKEND_IMAGE:?Image selection belongs to the controlled deployment command}
    platform: linux/arm64
    container_name: pulsegrid-production-backend
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/pulsegrid.db
    volumes:
      - type: bind
        source: /var/lib/pulsegrid
        target: /app/data
        bind:
          create_host_path: false
          propagation: rprivate
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    # Official 2.11.9-alpine manifest index, including linux/arm64.
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    platform: linux/arm64
    container_name: pulsegrid-production-caddy
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      # Mount the directory so atomic replacement remains visible to reloads.
      - type: bind
        source: /etc/pulsegrid/caddy
        target: /etc/caddy
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
    tmpfs:
      - /config:size=8m,mode=0700
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    external: true
    name: pulsegrid-production

volumes:
  caddy_data:
