name: Backend CI

on:
  workflow_call:
    outputs:
      validation_result:
        description: Result of the final backend validation step
        value: ${{ jobs.backend.outputs.validation_result }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      validation_result: ${{ steps.build.outcome }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        id: build
        run: go build ./...
