name: Frontend CI

on:
  workflow_call:
    inputs:
      export_build:
        description: Export the validated production build for this run
        type: boolean
        default: false
    outputs:
      validation_result:
        description: Result of the final frontend validation step
        value: ${{ jobs.frontend.outputs.validation_result }}
      artifact_id:
        description: Immutable ID of the validated build artifact
        value: ${{ jobs.frontend.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      validation_result: ${{ steps.build.outcome }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        id: build
        run: npm run build

      - name: Export validated build
        id: upload
        if: inputs.export_build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
